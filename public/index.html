<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reward App</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            background: #111; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        input { 
            padding: 15px; 
            margin: 10px 0; 
            width: 90%; 
            max-width: 300px; 
            border-radius: 8px; 
            border: 2px solid #333; 
            font-size: 16px;
            background: #222;
            color: white;
        }
        button { 
            padding: 15px 30px; 
            margin: 10px 0; 
            width: 90%; 
            max-width: 300px;
            border-radius: 8px; 
            border: none; 
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .login-btn { background: #007bff; color: white; }
        .register-btn { background: #28a745; color: white; }
        .hidden { display: none !important; }
        .card { background: #222; padding: 20px; border-radius: 10px; margin: 15px auto; max-width: 400px; }
        #auth-msg { color: #ff6b6b; margin: 15px 0; font-weight: bold; min-height: 24px; }
        #debug-info { 
            background: #1a1a2e; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 20px; 
            font-size: 12px; 
            text-align: left;
            word-break: break-all;
            color: #888;
        }
        .success { color: #51cf66 !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h1 style="margin-bottom: 30px;"> Reward App</h1>
        <div style="background:#222; padding:20px; border-radius:10px; margin-bottom:20px;">
            <h2 style="margin-top:0;">Login / Register</h2>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
            <button class="login-btn" onclick="handleLogin()">Login</button>
            <button class="register-btn" onclick="handleRegister()">Register</button>
        </div>
        <p id="auth-msg"></p>
        <div id="debug-info">
            <strong>Debug Info:</strong><br>
            API URL: <span id="api-url"></span><br>
            Status: <span id="api-status">Testing...</span>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <h1 style="margin-bottom: 20px;"> Dashboard</h1>
        
        <div class="card">
            <h2 style="margin:0; color:#4dabf7;">Balance: <span id="balance">0</span> pts</h2>
            <p style="margin:5px 0; color:#ffd43b;">Value: $<span id="value">0.00</span></p>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">🎰 Daily Spin</h3>
            <button class="login-btn" onclick="doAction('/api/spin')">Spin (Watch Ad)</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">️ Mining</h3>
            <button style="background:#fd7e14; color:white;" onclick="doAction('/api/mine')">Mine (Watch Ad)</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">💵 Withdraw</h3>
            <button style="background:#ffc107; color:black;" onclick="handleWithdraw()">Request $100</button>
        </div>
        
        <button style="background:#dc3545; color:white;" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        const API = window.location.origin;
        let token = localStorage.getItem('token');
        
        // Show API URL in debug info
        document.getElementById('api-url').textContent = API;

        // Test API connection on load
        testAPIConnection();

        if(token) showDashboard();

        async function testAPIConnection() {
            try {
                const res = await fetch(`${API}/api/dashboard`);
                const status = res.status;
                document.getElementById('api-status').innerHTML = 
                    `<span style="color:#51cf66">✅ Server OK (Status ${status})</span>`;
            } catch(err) {
                document.getElementById('api-status').innerHTML = 
                    `<span style="color:#ff6b6b"> Server Down</span><br>Error: ${err.message}`;
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                showMessage('Please enter email and password', false);
                return;
            }

            showMessage('Connecting to server...', false);
            
            try {
                console.log('Attempting login to:', `${API}/api/login`);
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Login response status:', res.status);
                const data = await res.json();
                console.log('Login response data:', data);
                
                if(data.token) { 
                    localStorage.setItem('token', data.token); 
                    showDashboard(); 
                } else {
                    showMessage(data.error || 'Login failed', false);
                }
            } catch(err) {
                console.error('Login error:', err);
                showMessage(`Connection error: ${err.message}`, false);
            }
        }

        async function handleRegister() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                showMessage('Please enter email and password', false);
                return;
            }

            showMessage('Creating account...', false);
            
            try {
                const res = await fetch(`${API}/api/register`, {
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if(data.token) { 
                    localStorage.setItem('token', data.token); 
                    showDashboard(); 
                } else {
                    showMessage(data.error || 'Registration failed', false);
                }
            } catch(err) {
                showMessage(`Connection error: ${err.message}`, false);
            }
        }

        function showDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            updateBalance();
        }

        async function updateBalance() {
            try {
                const res = await fetch(`${API}/api/dashboard`, { 
                    headers: { Authorization: `Bearer ${token}` }
                });
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('balance').innerText = data.balance;
                    document.getElementById('value').innerText = (data.balance * 0.15).toFixed(2);
                }
            } catch(err) {
                console.error('Balance error:', err);
            }
        }

        async function doAction(endpoint) {
            alert(" Watching ad for 3 seconds...");
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            try {
                const res = await fetch(`${API}${endpoint}`, {
                    method: 'POST', 
                    headers: { 
                        'Content-Type': 'application/json', 
                        Authorization: `Bearer ${token}` 
                    },
                    body: JSON.stringify({ adVerified: true })
                });
                const data = await res.json();
                if(data.points) { 
                    alert(`✅ Earned ${data.points} points!`); 
                    updateBalance(); 
                } else {
                    alert(data.error || 'Failed');
                }
            } catch(err) {
                alert(`Connection error: ${err.message}`);
            }
        }

        async function handleWithdraw() {
            try {
                const res = await fetch(`${API}/api/withdraw`, {
                    method: 'POST', 
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                alert(data.message || data.error);
                updateBalance();
            } catch(err) {
                alert(`Connection error: ${err.message}`);
            }
        }

        function handleLogout() {
            if(confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                location.reload();
            }
        }

        function showMessage(text, isSuccess) {
            const msgEl = document.getElementById('auth-msg');
            msgEl.innerText = text;
            msgEl.className = isSuccess ? 'success' : '';
        }
    </script>
</body>
</html>
