<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward App</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        input, button { padding: 10px; margin: 5px; width: 90%; max-width: 300px; border-radius: 5px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; }
        .hidden { display: none; }
        .card { background: #222; padding: 20px; border-radius: 10px; margin: 10px auto; max-width: 400px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="auth-screen">
        <h2>Login / Register</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="register()" style="background:#28a745">Register</button>
        <p id="auth-msg" style="color:red"></p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="card">
            <h3>Balance: <span id="balance">0</span> pts</h3>
            <p>Value: $<span id="value">0.00</span></p>
            <p style="font-size:12px; color:#888">Need 667 pts ($100) to withdraw</p>
        </div>

        <div class="card">
            <h3>Daily Spin</h3>
            <button onclick="doAction('/api/spin')">Spin (Watch Ad)</button>
        </div>

        <div class="card">
            <h3>Mining</h3>
            <button onclick="doAction('/api/mine')" style="background:#fd7e14">Mine (Watch Ad)</button>
        </div>

        <div class="card">
            <h3>Withdraw</h3>
            <button onclick="withdraw()" style="background:#ffc107; color:black">Request $100</button>
        </div>
        <button onclick="logout()" style="background:#dc3545">Logout</button>
    </div>

    <script>
        const API = window.location.origin;
        let token = localStorage.getItem('token');

        if(token) showDashboard();

        async function login() {
            const res = await fetch(`${API}/api/login`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            if(data.token) { localStorage.setItem('token', data.token); showDashboard(); }
            else document.getElementById('auth-msg').innerText = data.error;
        }

        async function register() {
            const res = await fetch(`${API}/api/register`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            if(data.token) { localStorage.setItem('token', data.token); showDashboard(); }
            else document.getElementById('auth-msg').innerText = data.error;
        }

        function showDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            updateBalance();
        }

        async function updateBalance() {
            const res = await fetch(`${API}/api/dashboard`, { headers: { Authorization: `Bearer ${token}` }});
            const data = await res.json();
            document.getElementById('balance').innerText = data.balance;
            document.getElementById('value').innerText = (data.balance * 0.15).toFixed(2);
        }

        async function doAction(endpoint) {
            // Simulate Ad Watch
            alert("Simulating Ad Watch... (Connect Monetag here later)");
            
            const res = await fetch(`${API}${endpoint}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({ adVerified: true })
            });
            const data = await res.json();
            if(data.points) { alert(`Earned ${data.points} points!`); updateBalance(); }
            else alert(data.error);
        }

        async function withdraw() {
            const res = await fetch(`${API}/api/withdraw`, {
                method: 'POST', headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            alert(data.message || data.error);
            updateBalance();
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }
    </script>
</body>
</html>
